reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!**/*.webp"
    - "!**/*.avif"
    - "!**/*.woff2"
    - "!**/*.jpeg"
    - "!**/*.jpg"
    - "!**/*.png"
    # WHY *.md is NOT excluded (owner decision 2026-08-03): on the free
    # CodeRabbit plan this bot is often the only reviewer a PR gets, and the
    # global pre-push rework (claude-global-config PR #15) makes
    # markdown-only pushes skip local suites entirely once merged. Blanket-
    # excluding .md meant README/docs changes could reach a PR with zero
    # review anywhere. Re-adding this exclusion recreates that blind spot.
    - "!public/images/**"
    - "!src/assets/**"
    - "!public/sitemap.xml"
    - "!.firebaserc"
    - "!.nvmrc"
    - "!public/js/shader-app.js"
