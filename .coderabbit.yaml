reviews:
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!**/*.webp"
    - "!**/*.avif"
    - "!**/*.woff2"
    - "!**/*.jpeg"
    - "!**/*.jpg"
    - "!**/*.png"
    # WHY *.md is NOT excluded (owner decision 2026-08-03): journal posts and
    # copy are .md and are exactly the content the md-only pre-push fast path
    # skips local checks for. CodeRabbit is the remaining reviewer for them;
    # excluding markdown left those changes with no review before merge.
    - "!public/images/**"
    - "!src/assets/**"
    - "!public/sitemap.xml"
    - "!.firebaserc"
    - "!.nvmrc"
    - "!public/js/shader-app.js"
