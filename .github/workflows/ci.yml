# .github/workflows/ci.yml
#
# Both checks below ("Lint, Types, Test, Build" and "Firestore/Storage rules
# (emulator)") MUST be required by the repo ruleset "Protect Main" (managed in
# GitHub Settings, Rules, which no file in this repo can read or write).
#
# STATE (2026-09-02): the ruleset requires "Lint, Types, Test, Build" only.
# "Firestore/Storage rules (emulator)" is listed here, in
# scripts/setup-branch-protection.sh and in docs/security/REMEDIATION.md as
# required, but until an operator adds that exact string to the ruleset it stays
# ADVISORY: it runs and shows a red X on the PR, and the merge goes through
# anyway. Tracked as [NON-BLOCKING-RULES-GATE] in BUGS.md until someone confirms
# the merge box lists two required checks. Two constraints follow:
#
# WHY there is no paths-ignore on the trigger (2026-07-14): a required check
# that never starts blocks the PR forever. The old `paths-ignore: **.md` meant
# every docs-only PR (BUGS.md/ENHANCEMENTS.md routing produces them routinely)
# sat permanently BLOCKED waiting for a check that would never report (hit on
# PR #139). Full CI now runs on EVERY PR by owner decision: no conditional
# skips and no success reported without the checks actually running, because
# a green check whose meaning varies by code path is a latent trap. Re-adding
# paths-ignore re-creates the deadlock; skip-but-report-success patterns were
# explicitly rejected as false success reporting.
#
# WHY the job names must not change: the ruleset matches each check by its
# exact `name:` string. Renaming a job here without renaming the required check
# in the ruleset (and in scripts/setup-branch-protection.sh) means the required
# name never reports again and every PR is permanently BLOCKED (the same
# deadlock, different trigger). Rename both together or neither.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Lint + Type Check + Tests + Build
  # One npm ci. Fast fail order: lint → types → tests → build → audit.
  # ==========================================
  check:
    name: Lint, Types, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # WHY fetch-depth: 0 (not the default shallow clone): the patch-coverage
          # step below diffs the PR head against its base commit. A shallow clone
          # only has the tip commit, so `git diff <base> <head>` fails with
          # "unknown revision" the moment the base isn't the immediate parent.
          fetch-depth: 0
          # Check out the PR's actual head commit, not GitHub's ephemeral test-merge
          # commit (the default for pull_request events). The merge commit has no
          # stable SHA to diff against and changes shape independent of the PR itself.
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npx astro check
      - run: npm run test:coverage
      - name: Patch coverage gate (new/changed lines must be tested)
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/diff-coverage.mjs
      - run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

  # ==========================================
  # JOB 2: Security rules against the Firebase emulator.
  # The only test class that exercises firestore.rules/storage.rules with the
  # REAL client operations of the apply flow (a rules/client mismatch took
  # the form down for a week in July 2026). Too heavy for local pre-commit,
  # which is exactly why it is a REQUIRED check: nothing else stops a rules
  # regression from merging. Like job 1 it runs on every PR unconditionally,
  # so requiring it cannot deadlock a merge.
  # ==========================================
  rules:
    name: Firestore/Storage rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run test:rules

  # Playwright smoke tests moved to local pre-push hook (~/.git-hooks/pre-push).
  # This eliminates the primary GitHub Actions minute consumer.
  # Production coverage: smoke-tests.yml runs weekly against all 4 viewports on schedule.
