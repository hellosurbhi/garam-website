name: Keep current Vercel deployment

on:
  status:
  deployment_status:
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what cleanup would delete without deleting anything"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prune-vercel-deployments
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success') ||
      (github.event_name == 'deployment_status' && github.event.deployment.creator.login == 'vercel[bot]' && github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # WHY the dry run checks out the dispatched commit: deletion always runs
        # trusted main code, but a cleanup change must be proven against the
        # real Vercel API before it reaches main. Only repository writers can
        # dispatch, and a dry run never calls DELETE.
        with:
          ref: ${{ inputs.dry_run && github.sha || 'main' }}
          persist-credentials: false
      - name: Remove obsolete deployments after protecting the live production target
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            node scripts/prune-vercel-deployments.mjs
          else
            node scripts/prune-vercel-deployments.mjs --apply
          fi
