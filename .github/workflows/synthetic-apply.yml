# Synthetic apply-form monitor, every 6 hours.
#
# Submits ONE real application on production with reserved synthetic markers
# (name "SYNTHETIC MONITOR", email synthetic-monitor@garammasaladating.com,
# isSynthetic flag), verifies the document actually landed in Firestore via
# the service account, then deletes only documents carrying all synthetic
# markers (see scripts/synthetic-apply-verify.mjs for the delete safety
# rules). notify-application skips emails for it; the admin dashboard hides it.
#
# This is the only check that exercises the deployed stack end to end
# (security rules, Firebase config, Vercel env, CSP) — the class of breakage
# that mocked tests can never catch and that cost a week of applicants in
# July 2026. On any failure it fires the same real-time alert email a real
# failed applicant would.
#
# Required repo secrets: FIREBASE_ADMIN_CLIENT_EMAIL, FIREBASE_ADMIN_PRIVATE_KEY,
# FIREBASE_PROJECT_ID, FIREBASE_STORAGE_BUCKET.
name: Synthetic Apply Monitor

on:
  schedule:
    - cron: "30 1,7,13,19 * * *" # every 6 hours; bounds prod-only breakage to ~6h
  workflow_dispatch:

permissions:
  contents: read
  # issues: write exists ONLY for the failure pager step below: a broken
  # site must never be the sole alert channel again (2026-08-19
  # postmortem: a week of failures alerted through the site's own dead
  # email path while every application was rejected).
  issues: write

concurrency:
  group: synthetic-apply
  cancel-in-progress: false

jobs:
  synthetic:
    name: Real submission + verify + cleanup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Submit synthetic application on production
        run: npx playwright test --config playwright.synthetic.config.ts
        env:
          PLAYWRIGHT_BASE_URL: https://garammasaladating.com
      - name: Verify document landed and clean up
        # if: always() (2026-08-19): these two steps ARE the diagnosis
        # (Firestore ground truth, deployed-rules drift) and sat skipped
        # behind the failing submit step for a week, hiding both the
        # root cause and the real-applicant impact.
        if: always()
        run: node scripts/synthetic-apply-verify.mjs
        env:
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      - name: Check deployed rules match the repo
        if: always()
        run: node scripts/check-rules-drift.mjs
        env:
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      - name: Weekly pager heartbeat (Mondays 13:30 UTC run only)
        # always(), not success() (2026-08-19): gating the pager-liveness
        # test on the monitor passing meant a permanently failing monitor
        # also silenced the weekly proof that the alert channel works —
        # the exact combination that hid this outage.
        if: always()
        run: |
          # A silently dead alert channel (expired SMTP password, broken env)
          # looks identical to "no failures". One heartbeat email per week
          # through the REAL alert path proves the pager itself still works.
          if [ "$(date -u +%u-%H)" = "1-13" ]; then
            curl -sS -X POST https://garammasaladating.com/api/alert-failure \
              -H "Content-Type: application/json" \
              -H "Origin: https://garammasaladating.com" \
              -d '{"flow":"ops","stage":"heartbeat","errorMessage":"Weekly pager test: the synthetic monitor and the alert channel are both working. No action needed."}'
          else
            echo "Not the Monday 13:30 run; skipping heartbeat."
          fi
      - name: Page the producer via GitHub issue on failure
        # Independent of the website: gh with the workflow token opens or
        # updates one issue thread; GitHub emails the owner natively. The
        # site-channel page below stays as the second channel.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Synthetic apply monitor failing"
          BODY="The production apply form monitor FAILED. Run: $RUN_URL — check the verify and rules-drift step outputs in the same run for the cause and applicant impact."
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee hellosurbhi
          fi
      - name: Page the producer on failure
        if: failure()
        # Expressions come in through env, not inline interpolation, so a
        # future attacker-controllable field can never inject into the shell.
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://garammasaladating.com/api/alert-failure \
            -H "Content-Type: application/json" \
            -H "Origin: https://garammasaladating.com" \
            -d "{\"flow\":\"ops\",\"stage\":\"synthetic_monitor\",\"errorMessage\":\"Synthetic apply monitor FAILED: the production apply form is likely broken. Check the GitHub Actions run for details.\",\"pageUrl\":\"$RUN_URL\",\"userAgent\":\"synthetic-apply-monitor\"}"
      - name: Upload report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-apply-report
          path: playwright-report/
          retention-days: 7
